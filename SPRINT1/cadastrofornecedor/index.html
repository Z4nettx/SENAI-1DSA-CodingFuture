<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervejaria Dogma - Cadastro de Fornecedores</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="/assets/favicon-dogma.ico" type="image/x-icon">
</head>

<body>
    <div class="container">
        <header class="header-login">
            <a href="/paineladmin/index.html"><i class="fa-solid fa-arrow-left" title="Voltar"></i></a>
            <img src="/assets/logo.png" alt="Logo Dogma Cervejaria" class="logo-dogma" />
            <a href="/login/index.html" class="login-link">Fazer Login</a>
        </header>

        <form class="form">
            <h2>Cadastro de Fornecedores</h2>
            <h3>Informações Gerais</h3>
            <input type="text" placeholder="Nome Fornecedor">
            <input type="text" placeholder="País/Região">
            <input type="text" placeholder="Endereço">
            <div class="input-row">
                <input type="text" placeholder="CNPJ">
                <input type="text" placeholder="Observações">
            </div>
            <input type="text" placeholder="Estado">
            <button type="submit">Próximo</button>
        </form>
    </div>

</body>

</html>
